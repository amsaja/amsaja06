<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="소설가 김슬기 공식 홈페이지. 작품, 수상·선정, 번역, 칼럼, 강연, 기사와 인터뷰 아카이브.">
  <title>김슬기 | Kim Seulgi</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="site">
    <header class="profile" id="top">
      <div class="profile-copy">
        <h1 id="name"></h1>
        <p class="role" id="roles"></p>
        <p class="summary" id="summary"></p>
        <p class="focus" id="focus"></p>
        <p class="location" id="location"></p>

        <div class="contact-top">
          <h2>연락처</h2>
          <p><span>Email</span><span id="email"></span></p>
          <p><span>Instagram</span><a id="instagram" target="_blank" rel="noopener">@hit_seul ↗</a></p>
          <p><span>Blog</span><a id="blog" target="_blank" rel="noopener">amsaja_books ↗</a></p>
        </div>
      </div>
      <figure class="profile-photo"><img src="assets/images/profile.jpg" alt="소설가 김슬기"></figure>
    </header>

    <nav class="section-nav" aria-label="페이지 목차">
      <a href="#news">최근 소식</a>
      <a href="#selected">주요 활동</a>
      <a href="#work">작품</a>
      <a href="#awards">수상 및 선정</a>
            <a href="#blurbs">추천사</a>
      <a href="#column">칼럼</a>
      <a href="#talks">강연과 수업</a>
      <a href="#press">기사와 인터뷰</a>
    </nav>

    <section id="news" class="news-section">
      <div class="section-heading">
        <h2>최근 소식</h2>
        <span>News & Updates</span>
      </div>
      <div id="news-list" class="news-list"></div>
    </section>

    <section id="selected">
      <h2>주요 활동</h2>
      <div id="selected-list" class="rows"></div>
    </section>

    <section id="work">
      <h2>작품</h2>
      <h3>단행본</h3>
      <div id="books" class="rows"></div>
      <h3>해외 번역판</h3>
      <div id="translations-list" class="rows"></div>
      <h3>단편소설</h3>
      <div id="short-fiction" class="rows"></div>
    </section>

    <section id="awards">
      <h2>수상 및 선정</h2>
      <div id="awards-list" class="rows"></div>
    </section>
<section id="blurbs">
      <h2>추천사</h2>
      <div id="blurbs-list" class="rows"></div>
    </section>

    <section id="column">
      <h2>칼럼</h2>
      <div id="columns-list" class="rows"></div>
    </section>

    <section id="talks">
      <h2>강연과 수업</h2>
      <figure class="talk-photo">
        <img src="assets/images/seoul-bookfair-2026.jpg" alt="2026 서울국제도서전 세션에서 이야기하는 김슬기 소설가">
        <figcaption>2026 서울국제도서전 · 「익숙한 세계를 뒤집는 재미」 <span>© 서울국제도서전</span></figcaption>
      </figure>
      <div id="talks-list"></div>
    </section>

    <section id="press">
      <h2>기사와 인터뷰</h2>
      <div id="press-list" class="rows press-rows"></div>
    </section>

    <section id="social">
      <h2>SNS</h2>
      <p class="social-links"><a id="social-instagram" target="_blank" rel="noopener">인스타그램 ↗</a><a id="social-blog" target="_blank" rel="noopener">네이버 블로그 ↗</a></p>
    </section>

    <footer>
      <span>© Kim Seulgi</span>
      <span id="updated"></span>
      <a href="#top">Top ↑</a>
    </footer>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
